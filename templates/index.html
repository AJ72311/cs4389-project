<!DOCTYPE html>
<html>
<head>
    <title>CS4389 Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">CS4389 Shop</a>
        <div>
            {% if user %}
                <span class="text-white me-2">Hello, {{ user }}</span>
                <a class="btn btn-outline-danger btn-sm" href="/logout">Logout</a>
            {% else %}
                <a class="btn btn-primary btn-sm" href="/login">Login</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    <h2>Products</h2>
    <div class="row mt-3">
        {% for p in products %}
        <div class="col-md-4 mb-3">
            <div class="card p-3">
                <h5>{{ p['name'] }}</h5>
                <p class="text-muted">{{ p['description'] }}</p>
                <h6>${{ p['price'] }}</h6>
                <button class="btn btn-secondary btn-sm" disabled>Add to Cart</button>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
