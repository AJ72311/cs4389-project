<!DOCTYPE html>
<html>
<head>
    <title>Search - CS4389 Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">CS4389 Shop</a>
        <a class="btn btn-outline-light btn-sm" href="/">Home</a>
    </div>
</nav>

<div class="container">
    <h3>Search products {% if safe %}(secure){% else %}(vulnerable){% endif %}</h3>
    <form method="GET" class="mb-3">
        <input type="text" name="q" class="form-control" placeholder="Search...">
        <button class="btn btn-primary btn-sm mt-2">Search</button>
    </form>
    <div class="card p-3">
        {% if safe %}
            <p>Results for: {{ q }}</p>
        {% else %}
            <p>Results for: {{ q|safe }}</p>
        {% endif %}
    </div>
</div>
</body>
</html>
